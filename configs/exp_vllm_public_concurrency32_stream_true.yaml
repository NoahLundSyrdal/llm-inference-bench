name: exp-vllm-public-concurrency32-stream-true
backend:
  engine: vllm
  base_url: http://localhost:8000
  model: Qwen/Qwen2-0.5B-Instruct
  endpoint: /v1/chat/completions

generation:
  max_tokens: 96
  temperature: 0.0
  top_p: 1.0
  stream: true
  request_timeout_s: 120

workload:
  label: quickstart
  prompts_file: ../prompts/quickstart.json
  prompt_field: prompt
  num_requests: 48
  shuffle: true
  seed: 42

concurrency_sweep: [1, 2, 4, 8, 16, 32]
repetitions: 1
output_dir: ../results/exp-qwen2-0.5b-concurrency32-stream-true
metadata:
  experiment: streaming-comparison
